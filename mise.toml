[tools]
# Use the native Linux xmake to match the distribution's ncurses ABI.
"github:xmake-io/xmake" = [{ version = "3.1.1", os = ["windows"], asset_pattern = "xmake-v{{ version }}.win64.zip", bin_path = "." }, { version = "system", os = ["linux"] }]
python = "3.12.10"
rust = { version = "1.98.1", os = ["windows"] }
